<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어구름">
<meta name="description" content="프랑스어·러시아어·터키어 단어 암기">
<title>단어 구름</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --ink:#2b2a30; --muted:#6f6b75; --soft:#9a96a0;
  --bg:#f6f5f8; --card:#fff; --line:#e8e6ed;
  --accent:#7a73c2; --accent-soft:#f0eef8;
  --know:#3d8f7a; --know-bg:#eaf6f2;
  --kinda:#9a7420; --kinda-bg:#f8f1de;
  --no:#b04a64; --no-bg:#fdeef2;
  --radius:16px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{min-height:100dvh;overflow-x:hidden}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
h1,h2,h3,h4,.display{font-weight:600;letter-spacing:-.02em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px;box-shadow:none}
textarea{min-height:120px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px}.row>*{flex:1}
.langs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0 12px}
.langs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;background:#fff;color:var(--ink);font-weight:500;white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.chip.add{background:transparent;color:var(--muted)}
.brand{margin:2px 0 16px}
.brand h1{margin:0;font-size:1.5rem}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem;font-weight:400}
.hero{background:var(--card);border-radius:var(--radius);padding:20px 20px 16px;border:1px solid var(--line);margin-bottom:16px}
.hero .k{color:var(--muted);font-size:.85rem}
.hero .n{font-size:2.6rem;line-height:1.05;letter-spacing:-.04em;margin:6px 0 14px;font-weight:650}
.hero .n small{font-size:1rem;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 18px;border-radius:12px;font-weight:600;background:#fff;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.know{background:var(--know-bg);color:var(--know);border-color:transparent}
.btn.kinda{background:var(--kinda-bg);color:var(--kinda);border-color:transparent}
.btn.no{background:var(--no-bg);color:var(--no);border-color:transparent}
.btn:disabled{opacity:.4}
.btn.block{width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{background:var(--card);border-radius:var(--radius);padding:var(--pad);border:1px solid var(--line);margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:1.05rem}
.field{margin:0 0 10px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 6px}
.hint{font-size:.8rem;color:var(--soft);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:.9rem;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.nav .bar{display:flex;gap:4px;background:transparent;border-radius:0;padding:0;width:100%;max-width:480px;box-shadow:none}
.nav button{flex:1;min-height:52px;border-radius:12px;color:var(--muted);font-size:.75rem;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{font-size:1.1rem;line-height:1}
.back{min-width:44px;min-height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:1.1rem}
.head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.head h2{margin:0;flex:1;font-size:1.15rem}
.duepill{background:var(--accent-soft);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;color:var(--accent)}
.deck{perspective:1200px;margin:8px 0 16px}
.flash{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:var(--radius);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .w{font-size:1.8rem;word-break:break-word;font-weight:650}
.face .m{font-size:1.35rem;word-break:break-word;font-weight:500}
.face .ex{margin-top:10px;color:var(--muted);font-size:.95rem}
.face .tap{position:absolute;bottom:12px;color:var(--soft);font-size:.78rem}
.spk{position:absolute;top:12px;right:12px;min-width:44px;min-height:44px;border-radius:12px;background:var(--accent-soft);z-index:2}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.prog{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.search{margin-bottom:12px}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;min-height:56px;border-radius:12px;background:#fff;border:1px solid var(--line);margin:0 0 8px}
.item .meta{flex:1;min-width:0}
.item .w{font-weight:600;word-break:break-word}
.item .m{color:var(--muted);font-size:.9rem;word-break:break-word}
.item .tag{font-size:.75rem;color:var(--accent);margin-top:2px}
.dots{display:flex;gap:4px;padding-top:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:#e4e2e8;display:block}
.dots i.on{background:var(--accent)}
.dots i.ok{background:var(--know)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.qcard{background:var(--card);border-radius:var(--radius);padding:22px 18px;text-align:center;margin-bottom:16px;border:1px solid var(--line)}
.qcard .prompt{color:var(--muted);font-size:.85rem}
.qcard .q{font-size:1.45rem;margin:8px 0 0;word-break:break-word;font-weight:650}
.choices{display:grid;gap:8px}
.choices button{min-height:52px;text-align:center;background:#fff;border-radius:12px;padding:12px;border:1px solid var(--line);font-weight:500;word-break:break-word}
.choices button.ok{background:var(--know-bg);border-color:var(--know)}
.choices button.bad{background:var(--no-bg);border-color:var(--no)}
.feedback{text-align:center;margin:10px 0;font-weight:600}
.ov{position:fixed;inset:0;background:#2b2a3066;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow:auto}
.sheet .grab{width:36px;height:4px;border-radius:4px;background:#e0dde6;margin:2px auto 10px}
.sheet h3{margin:0 0 12px;font-size:1.15rem;display:flex;align-items:center;gap:8px;font-weight:600}
.sheet h3 .x{margin-left:auto;min-width:44px;min-height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.install{display:none;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:12px;min-height:44px;font-size:.85rem;color:var(--muted)}
.install.show{display:flex}
.more button{display:block;width:100%;text-align:left;min-height:48px;padding:8px 4px;color:var(--ink);border-bottom:1px solid var(--line)}
.more button.hint{border:none;color:var(--muted);font-weight:400}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.picks.hscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-bottom:12px}
.picks.hscroll::-webkit-scrollbar{display:none}
.picks .chip{background:#fff;box-shadow:none;padding:0 12px}
.picks .chip.on{background:var(--accent-soft);border-color:transparent}
.picks .chip .c{font-size:.75rem;color:var(--muted);margin-left:4px;font-weight:500}
.lbl{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.crow{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin:0 0 8px}
.crow .pn{font-size:.85rem;color:var(--muted)}
.crow input.auto{background:var(--accent-soft);border-color:#ddd8ee}
.ab{font-size:.65rem;color:var(--accent);font-weight:600;margin-left:4px}
.tense{margin:0 0 20px}
.tense h4{margin:0 0 10px;font-size:1rem}
.cell{position:relative;min-height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:flex-start;padding:8px 12px;border:1px solid var(--line);text-align:left;width:100%;font-size:16px;word-break:break-word}
.cell.hid{background:var(--accent-soft);border-color:transparent;color:transparent}
.cell.hid::after{content:"탭해서 보기";color:var(--soft);position:absolute;left:12px;font-size:.85rem}
.item .go{min-width:44px;min-height:44px;border-radius:12px;background:var(--accent-soft);font-size:.75rem;font-weight:600;color:var(--accent);flex:0 0 auto;align-self:center;border:none}
@media (min-width:800px){
  .ov{align-items:center}
  .sheet{border-radius:16px;margin-bottom:0;max-height:85vh;border:1px solid var(--line)}
  .sheet .grab{display:none}
}
@media (prefers-reduced-motion:reduce){.flash,.toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const KEY="vocab-cloud-v1";
const PRESETS=[{id:"fr",name:"프랑스어",flag:"🇫🇷",tts:"fr-FR"},{id:"ru",name:"러시아어",flag:"🇷🇺",tts:"ru-RU"},{id:"tr",name:"터키어",flag:"🇹🇷",tts:"tr-TR"}];
const POS=[{id:"n",name:"명사"},{id:"adj",name:"형용사"},{id:"v",name:"동사"},{id:"adv",name:"부사"},{id:"other",name:"기타"}];
const SUBS={
  n:["동물","교통수단","식물","날씨","음식","가족·사람","신체","집·물건","장소","직업","시간·날짜","감정","옷","자연","기타"],
  adj:["감정·성격","색깔","크기·모양","맛","상태","기타"],
  v:["일상","이동","감정·생각","말하기","기타"],
  adv:["빈도","시간","장소","정도","방법","기타"],
  other:["기타"]
};
const FR_P=[{id:"je",name:"je"},{id:"tu",name:"tu"},{id:"il",name:"il / elle"},{id:"nous",name:"nous"},{id:"vous",name:"vous"},{id:"ils",name:"ils / elles"}];
const TR_P=[{id:"ben",name:"ben"},{id:"sen",name:"sen"},{id:"o",name:"o"},{id:"biz",name:"biz"},{id:"siz",name:"siz"},{id:"onlar",name:"onlar"}];
const RU_P=[{id:"ja",name:"я"},{id:"ty",name:"ты"},{id:"on",name:"он / она"},{id:"my",name:"мы"},{id:"vy",name:"вы"},{id:"oni",name:"они"}];
const RU_PAST=[{id:"m",name:"남성"},{id:"f",name:"여성"},{id:"n",name:"중성"},{id:"pl",name:"복수"}];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=(m)=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800)};
function posName(id){return POS.find(p=>p.id===id)?.name||(id?"기타":"미분류")}
function allSubs(pos){if(!pos)return[];const d=SUBS[pos]||["기타"],c=(S.customSub[pos]||[]);const extra=[];
  words().forEach(w=>{if(w.pos===pos&&w.sub&&!d.includes(w.sub)&&!c.includes(w.sub)&&!extra.includes(w.sub))extra.push(w.sub)});
  return [...d,...c.filter(x=>!d.includes(x)),...extra]}
function migrate(s){s.customSub=s.customSub||{n:[],adj:[],v:[],adv:[],other:[]};
  s.words=s.words||{};Object.values(s.words).forEach(arr=>(arr||[]).forEach(w=>{if(w.pos==null)w.pos="";if(w.sub==null)w.sub="";w.conj=w.conj||{};w.conjAuto=w.conjAuto||{};w.conjSRS=w.conjSRS||{}}));
  return s}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.langs)&&s.words)return migrate(s)}catch(e){}
  return migrate({cur:"fr",langs:PRESETS.map(l=>({...l})),words:{}})}
let S=load();
const save=()=>localStorage.setItem(KEY,JSON.stringify({cur:S.cur,langs:S.langs,words:S.words,customSub:S.customSub,lastPos:S.lastPos||"",lastSub:S.lastSub||""}));
const L=()=>S.langs.find(l=>l.id===S.cur)||S.langs[0];
const words=()=>S.words[S.cur]||(S.words[S.cur]=[]);
const setWords=arr=>{S.words[S.cur]=arr;save()};
const dueWords=()=>{const t=today();return words().filter(w=>!w.due||w.due<=t)};
function byFilter(list,f){f=f||{};return list.filter(w=>{
  if(f.pos==="__none__")return !w.pos;
  if(f.pos&&w.pos!==f.pos)return false;
  if(f.sub==="__none__")return w.pos===(f.pos||w.pos)&&!w.sub;
  if(f.sub&&w.sub!==f.sub)return false;return true})}
function mastery(w){if(!w.last&&(w.reps||0)===0)return 0;if((w.reps||0)===0)return 1;if((w.interval||0)>=21)return 5;if((w.interval||0)>=7)return 4;if((w.reps||0)>=2)return 3;return 2}
function grade(w,q){w.ease=w.ease||2.5;w.reps=w.reps||0;w.interval=w.interval||0;w.lapses=w.lapses||0;
  if(q<3){w.reps=0;w.interval=0;w.lapses++;w.due=addDays(today(),1)}
  else{if(w.reps===0)w.interval=1;else if(w.reps===1)w.interval=(q===3?3:6);else w.interval=Math.max(1,Math.round(w.interval*w.ease*(q===3?0.85:1)));w.reps++;w.due=addDays(today(),w.interval)}
  w.ease=Math.max(1.3,w.ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));w.last=today()}
function gradeConj(w,key,q){w.conjSRS=w.conjSRS||{};const c=w.conjSRS[key]||{ease:2.5,interval:0,reps:0,lapses:0,due:today(),last:null};
  grade(c,q);w.conjSRS[key]=c}
function speak(text){if(!text||!window.speechSynthesis){toast("이 기기는 소리 읽기를 지원하지 않아");return}
  const u=new SpeechSynthesisUtterance(text);u.lang=L().tts||"en-US";
  const vs=speechSynthesis.getVoices()||[];const pref=(L().tts||"").slice(0,2).toLowerCase();
  u.voice=vs.find(v=>v.lang===L().tts)||vs.find(v=>v.lang.toLowerCase().startsWith(pref))||null;
  speechSynthesis.cancel();speechSynthesis.speak(u)}
if(window.speechSynthesis)speechSynthesis.addEventListener("voiceschanged",()=>{});
function guessGroup(word,lang){const w=(word||"").toLowerCase().trim();if(!isFr(lang))return"";
  if(w==="aller")return"irr";if(w.endsWith("er"))return"er";if(w.endsWith("ir"))return"ir";if(w.endsWith("re"))return"re";return"irr"}
function mkWord(word,meaning,ex,pos,sub){const w={id:uid(),word:word.trim(),meaning:meaning.trim(),ex:(ex||"").trim(),created:new Date().toISOString(),ease:2.5,interval:0,reps:0,lapses:0,due:today(),last:null,pos:pos||"",sub:sub||"",conj:{},conjAuto:{},conjSRS:{},vgroup:"",aspectImp:"",aspectPf:""};
  if(w.pos==="v"){w.vgroup=guessGroup(w.word,L());autoFill(w,false)}
  return w}
function addOne(word,meaning,ex,pos,sub){if(!word||!meaning)return false;words().push(mkWord(word,meaning,ex,pos,sub));save();return true}
const shuffle=a=>{const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
function closeSheet(){document.getElementById("ov")?.remove()}
function openSheet(html){closeSheet();const d=document.createElement("div");d.className="ov";d.id="ov";d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener("click",e=>{if(e.target===d)closeSheet()});document.body.appendChild(d);d.querySelector("[data-autofocus]")?.focus()}

/* ===== conjugation schemas & auto-fill ===== */
function isFr(l){l=l||L();return l.id==="fr"||l.tts==="fr-FR"}
function isRu(l){l=l||L();return l.id==="ru"||l.tts==="ru-RU"}
function isTr(l){l=l||L();return l.id==="tr"||l.tts==="tr-TR"}
function schema(l){l=l||L();
  if(isFr(l))return{tenses:[{id:"pres",name:"présent",persons:FR_P},{id:"pc",name:"passé composé",persons:FR_P},{id:"fut",name:"futur simple",persons:FR_P}],groups:[{id:"er",name:"-er"},{id:"ir",name:"-ir"},{id:"re",name:"-re"},{id:"irr",name:"불규칙"}]};
  if(isRu(l))return{tenses:[{id:"pres",name:"현재 / 미래",persons:RU_P},{id:"past",name:"과거",persons:RU_PAST}],groups:[],aspect:true};
  if(isTr(l))return{tenses:[{id:"simdi",name:"şimdiki zaman (-iyor)",persons:TR_P},{id:"genis",name:"geniş zaman",persons:TR_P},{id:"gecmis",name:"geçmiş zaman (-di)",persons:TR_P}],groups:[]};
  const persons=l.persons&&l.persons.length?l.persons:[{id:"p1",name:"1인칭 단수"},{id:"p2",name:"2인칭 단수"},{id:"p3",name:"3인칭 단수"},{id:"p4",name:"1인칭 복수"},{id:"p5",name:"2인칭 복수"},{id:"p6",name:"3인칭 복수"}];
  const tenses=l.tenses&&l.tenses.length?l.tenses:[{id:"t1",name:"기본"}];
  return{tenses:tenses.map(t=>({id:t.id,name:t.name,persons})),groups:[],custom:true}}
function ck(t,p){return t+"."+p}
function elideJe(form){return /^[aeiouàâäéèêëïîôùûh]/i.test(form)?"j'"+form:"je "+form}
function frEr(inf){const w=inf.trim().toLowerCase();if(!w.endsWith("er")||w==="aller")return null;
  const stem=w.slice(0,-2);const je=elideJe(stem+"e");
  let nous=stem+"ons";if(stem.endsWith("g"))nous=stem+"eons";if(stem.endsWith("c"))nous=stem.slice(0,-1)+"çons";
  const pp=stem+"é";
  return{
    "pres.je":je,"pres.tu":"tu "+stem+"es","pres.il":"il "+stem+"e","pres.nous":"nous "+nous,"pres.vous":"vous "+stem+"ez","pres.ils":"ils "+stem+"ent",
    "pc.je":"j'ai "+pp,"pc.tu":"tu as "+pp,"pc.il":"il a "+pp,"pc.nous":"nous avons "+pp,"pc.vous":"vous avez "+pp,"pc.ils":"ils ont "+pp,
    "fut.je":elideJe(w+"ai"),"fut.tu":"tu "+w+"as","fut.il":"il "+w+"a","fut.nous":"nous "+w+"ons","fut.vous":"vous "+w+"ez","fut.ils":"ils "+w+"ont"
  }}
function lastVow(s){const m=s.toLowerCase().match(/[aeıioöuü]/g);return m?m[m.length-1]:"a"}
function four(v){v=v.toLowerCase();if("aı".includes(v))return"ı";if("ei".includes(v))return"i";if("ou".includes(v))return"u";return"ü"}
function two(v){return"aıou".includes(v.toLowerCase())?"a":"e"}
function vowelsOf(s){return(s.toLowerCase().match(/[aeıioöuü]/g)||[]).length}
function voiceless(c){return"pçtkfhsş".includes(c.toLowerCase())}
function trForms(inf){const w=inf.trim().toLowerCase();if(!w.endsWith("mek")&&!w.endsWith("mak"))return null;
  const stem0=w.slice(0,-3),v=lastVow(stem0);let stemI=stem0;if(/[aeıioöuü]$/i.test(stemI))stemI=stemI.slice(0,-1);
  const yor=stemI+four(v)+"yor";
  const simdi={ben:yor+"um",sen:yor+"sun",o:yor,biz:yor+"uz",siz:yor+"sunuz",onlar:yor+"lar"};
  const dV=four(v),D=voiceless(stem0.slice(-1))?"t":"d",di=D+dV;
  const gecmis={ben:stem0+di+"m",sen:stem0+di+"n",o:stem0+di,biz:stem0+di+"k",siz:stem0+di+"n"+dV+"z",onlar:stem0+di+(two(dV)==="a"?"lar":"ler")};
  let base;if(/[aeıioöuü]$/i.test(stem0))base=stem0+"r";
  else if(vowelsOf(stem0)===1)base=stem0+two(v)+"r";
  else base=stem0+four(v)+"r";
  const gv=lastVow(base);
  const gEnd={ben:four(gv)+"m",sen:"s"+four(gv)+"n",o:"",biz:four(gv)+"z",siz:"s"+four(gv)+"n"+four(gv)+"z",onlar:two(gv)==="a"?"lar":"ler"};
  const genis={};["ben","sen","o","biz","siz","onlar"].forEach(p=>genis[p]=base+gEnd[p]);
  const out={};for(const[p,f]of Object.entries(simdi))out["simdi."+p]=f;
  for(const[p,f]of Object.entries(genis))out["genis."+p]=f;
  for(const[p,f]of Object.entries(gecmis))out["gecmis."+p]=f;
  return out}
function autoFill(w,overwrite){let forms=null;if(isFr()&&(w.vgroup||guessGroup(w.word,L()))==="er")forms=frEr(w.word);
  else if(isTr())forms=trForms(w.word);
  if(!forms)return 0;w.conj=w.conj||{};w.conjAuto=w.conjAuto||{};let n=0;
  Object.entries(forms).forEach(([k,v])=>{const edited=w.conj[k]&&w.conjAuto[k]===false;if(!overwrite&&edited)return;
    if(!overwrite&&w.conj[k]&&!w.conjAuto[k])return;
    w.conj[k]=v;w.conjAuto[k]=true;n++});return n}
function canAuto(w){return (isFr()&&(w.vgroup||guessGroup(w.word,L()))==="er"&&frEr(w.word))||(isTr()&&trForms(w.word))}

function viewConjReveal(){const w=conjWord();if(!w)return go("list"),"";const sc=schema();S.revealed=S.revealed||{};

function conjItems(filterWordId){const sc=schema();const items=[];const f=S.filter||{};
  let src=words().filter(w=>w.pos==="v");
  if(filterWordId)src=src.filter(w=>w.id===filterWordId);
  else if(f.pos&&f.pos!=="v")src=[];
  else src=byFilter(src,{pos:"v",sub:f.sub||undefined});
  src.forEach(w=>{sc.tenses.forEach(t=>t.persons.forEach(p=>{const k=ck(t.id,p.id),val=(w.conj||{})[k];if(!val||!val.trim())return;
    const srs=(w.conjSRS||{})[k];items.push({wid:w.id,key:k,tense:t,person:p,val,due:!srs||!srs.due||srs.due<=today()})}))});
  return items}
function startConjPrac(onlyId){let items=conjItems(onlyId);if(!items.length){toast("채워 둔 변화형이 없어. 표부터 적어 줘");return}
  const due=items.filter(i=>i.due);S.prac={queue:shuffle((due.length?due:items).slice()),done:[],wait:false,typed:"",onlyId:onlyId||null};S.view="conjprac";render();
  setTimeout(()=>document.getElementById("pIn")?.focus(),40)}
function viewConjPrac(){const P=S.prac;if(!P||!P.queue.length){
  return `<div class="head"><button class="back" data-go="quiz" aria-label="뒤로">←</button><h2>동사 변화 연습</h2></div>

    <button class="btn ghost block" data-go="quiz" style="margin-top:8px">퀴즈로</button></div>`}
  const it=P.queue[0],w=words().find(x=>x.id===it.wid);const n=P.done.length+1,tot=P.done.length+P.queue.length;
  return `<div class="head"><button class="back" data-go="quiz" aria-label="뒤로">←</button><h2>동사 변화 연습</h2><span class="duepill">${n} / ${tot}</span></div>
    <div class="qcard"><div class="prompt">${esc(it.tense.name)} · ${esc(it.person.name)}</div>
      <div class="q">${esc(w.word)}</div><p class="hint">${esc(w.meaning)}</p></div>
    ${P.wait?`<div class="feedback" style="color:${P.ok?"#1f6d5a":"#9a2748"}">${P.ok?"맞아!":"정답은 「"+it.val+"」"}</div>
      <div class="rate"><button class="btn no" data-prate="1">모름</button><button class="btn kinda" data-prate="3">애매</button><button class="btn know" data-prate="5">앎</button></div>`
      :`<form id="pracForm"><input id="pIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="이 인칭의 변화형을 적어 줘" value="${esc(P.typed||"")}">
        <button class="btn primary block" type="submit" style="margin-top:8px">확인</button></form>`}`}

function rateCard(q){const sess=S.sess,w=sess.queue[0];if(!w)return;
  grade(w,q);const arr=words();const i=arr.findIndex(x=>x.id===w.id);if(i>=0)arr[i]=w;save();
  sess.queue.shift();sess.done.push({id:w.id,q});
  if(q<3){sess.extra[w.id]=(sess.extra[w.id]||0)+1;if(sess.extra[w.id]<2)sess.queue.push(w)}
  sess.flipped=false;render()}
function pickMC(id){const Q=S.quiz;if(!Q||Q.wait)return;const w=Q.queue[0];finishQ(id===w.id,w,id)}
function checkType(){const Q=S.quiz;if(!Q||Q.wait)return;const w=Q.queue[0];const val=document.getElementById("qIn").value;finishQ(sameAns(val,w.word),w)}
function finishQ(ok,w,picked){const Q=S.quiz;Q.wait=true;if(ok){Q.correct++;grade(w,5)}else{Q.wrong++;grade(w,1);Q.retry.push(w)}
  const arr=words();const i=arr.findIndex(x=>x.id===w.id);if(i>=0)arr[i]=w;save();
  render();const el=document.getElementById("fb");if(el){el.textContent=ok?"맞아!":"정답은 「"+w.word+"」";el.style.color=ok?"#1f6d5a":"#9a2748"}
  if(Q.mode==="mc"){document.querySelectorAll("[data-pick]").forEach(b=>{b.disabled=true;if(b.dataset.pick===w.id)b.classList.add("ok");if(picked&&b.dataset.pick===picked&&!ok)b.classList.add("bad")})}}
function quizNext(){const Q=S.quiz;Q.queue.shift();Q.wait=false;Q.typed="";Q.opts=null;
  if(!Q.queue.length&&Q.retry.length){Q.queue=Q.retry.splice(0);toast("틀린 거 다시 한 번!")}
  render();if(Q.queue.length&&Q.mode==="type")document.getElementById("qIn")?.focus()}
function checkPrac(){const P=S.prac;if(!P||P.wait)return;const it=P.queue[0];const val=document.getElementById("pIn").value;P.ok=sameAns(val,it.val);P.wait=true;render()}
function ratePrac(q){const P=S.prac,it=P.queue[0];const w=words().find(x=>x.id===it.wid);if(w){gradeConj(w,it.key,q);save()}
  P.done.push({...it,ok:!!P.ok,q});P.queue.shift();P.wait=false;P.typed="";
  if(q<3)P.queue.push(it);render();if(P.queue.length&&!P.wait)document.getElementById("pIn")?.focus()}

function openAddLang(){openSheet(`<div class="grab"></div><h3>언어 추가 <button class="x" data-close aria-label="닫기">✕</button></h3>
  <form id="langForm"><div class="field"><label>이름</label><input name="name" required placeholder="예) 스페인어" data-autofocus></div>
  <div class="field"><label>국기 이모지 (선택)</label><input name="flag" placeholder="🇪🇸" maxlength="8"></div>
  <div class="field"><label>발음 언어 코드 (선택)</label><input name="tts" placeholder="es-ES"></div>
  <button class="btn primary block" type="submit">추가</button></form>`)}
function saveLang(){const f=document.getElementById("langForm");const name=f.name.value.trim();if(!name)return;
  const id=uid();S.langs.push({id,name,flag:(f.flag.value.trim()||"🌍"),tts:f.tts.value.trim()||""});S.cur=id;S.words[id]=[];save();closeSheet();render();toast(name+" 추가했어")}

function openAddSub(pos){S._subPos=pos;openSheet(`<div class="grab"></div><h3>세부 분류 추가 <button class="x" data-close aria-label="닫기">✕</button></h3>
  <p class="hint">${posName(pos)}에 새 칸을 만들게.</p>
  <form id="subForm"><input name="name" required placeholder="예) 요리" data-autofocus>
  <button class="btn primary block" type="submit" style="margin-top:8px">추가</button></form>`)}
function saveSub(){const name=document.querySelector("#subForm [name=name]").value.trim();const pos=S._subPos;if(!name||!pos)return;
  S.customSub[pos]=S.customSub[pos]||[];if(!allSubs(pos).includes(name))S.customSub[pos].push(name);
  S.lastSub=name;if(S.listPos===pos)S.listSub=name;save();closeSheet();
  if(S._edit){const w=words().find(x=>x.id===S._edit);if(w){w.pos=pos;w.sub=name;save();openEdit(w.id);return}}
  render();toast("「"+name+"」 칸을 만들었어")}

function openBulk(){const pos=S.lastPos||"",sub=S.bulkSub!=null?S.bulkSub:S.lastSub||"";
  openSheet(`<div class="grab"></div><h3>여러 개 넣기 <button class="x" data-close aria-label="닫기">✕</button></h3>
  <p class="hint">한 줄에 하나씩. 아래 분류가 이번 묶음 전체에 적용돼.</p>
  ${pickers("bulk",pos,sub,{allowNone:true})}
  <form id="bulkForm"><textarea name="bulk" data-autofocus placeholder="chat - 고양이&#10;chien - 개"></textarea>
  <button class="btn primary block" type="submit" style="margin-top:8px">한꺼번에 넣기</button></form>`)}
function parseLine(line){const s=line.trim();if(!s||s.startsWith("#"))return null;
  const m=s.match(/^(.+?)\s*[-–—=:：]+\s+(.+)$/)||s.match(/^(.+?)\t+(.+)$/);
  if(!m)return null;return{word:m[1].trim(),meaning:m[2].trim()}}
function doBulk(){const raw=document.querySelector("#bulkForm textarea").value.split(/\n+/);let n=0,skip=0;
  const pos=S.lastPos||"",sub=pos?(S.bulkSub!=null?S.bulkSub:S.lastSub)||"":"";
  raw.forEach(line=>{const p=parseLine(line);if(!p||!p.word||!p.meaning){if(line.trim())skip++;return}addOne(p.word,p.meaning,"",pos,sub);n++});
  closeSheet();render();toast(n?n+"개 넣었어"+(skip?" · "+skip+"줄은 건너뛰었어":""):"형식을 확인해 줘")}

function openEdit(id){const w=words().find(x=>x.id===id);if(!w)return;S._edit=id;
  openSheet(`<div class="grab"></div><h3>단어 고치기 <button class="x" data-close aria-label="닫기">✕</button></h3>
    <form id="editForm">
      ${pickers("edit",w.pos||"",w.sub||"",{allowNone:true})}
      <div class="field"><label>단어</label><input name="word" value="${esc(w.word)}" required data-autofocus></div>
      <div class="field"><label>뜻</label><input name="mean" value="${esc(w.meaning)}" required></div>
      <div class="field"><label>예문 / 메모</label><input name="ex" value="${esc(w.ex||"")}"></div>
      ${w.pos==="v"?`<button class="btn ghost block" type="button" data-conj="${w.id}" style="margin-bottom:8px">동사 변화 표</button>`:""}
      <button class="btn primary block" type="submit">저장</button>
      <button class="btn no block" type="button" id="delWord" style="margin-top:8px">삭제</button>
    </form>`)}
function saveEdit(){const id=S._edit,w=words().find(x=>x.id===id),f=document.getElementById("editForm");if(!w)return;
  const prev=w.word;w.word=f.word.value.trim();w.meaning=f.mean.value.trim();w.ex=f.ex.value.trim();if(!w.word||!w.meaning){toast("단어랑 뜻은 비울 수 없어");return}
  if(w.pos==="v"&&w.word!==prev){if(!w.vgroup)w.vgroup=guessGroup(w.word,L());autoFill(w,false)}
  save();closeSheet();S._edit=null;render();toast("고쳤어")}
function doDelete(){const id=S._edit;if(!confirm("이 단어를 삭제할까?"))return;setWords(words().filter(w=>w.id!==id));closeSheet();S._edit=null;render();toast("삭제했어")}

function openSchema(){const l=L();l.persons=l.persons||[{id:"p1",name:"1인칭 단수"},{id:"p2",name:"2인칭 단수"},{id:"p3",name:"3인칭 단수"},{id:"p4",name:"1인칭 복수"},{id:"p5",name:"2인칭 복수"},{id:"p6",name:"3인칭 복수"}];
  l.tenses=l.tenses||[{id:"t1",name:"기본"}];
  openSheet(`<div class="grab"></div><h3>인칭 / 시제 <button class="x" data-close aria-label="닫기">✕</button></h3>
    <form id="schemaForm">
      <div class="lbl">시제 이름 (한 줄에 하나)</div>
      <textarea name="tenses" style="min-height:80px">${l.tenses.map(t=>t.name).join("\n")}</textarea>
      <div class="lbl">인칭 이름 (한 줄에 하나)</div>
      <textarea name="persons" style="min-height:120px">${l.persons.map(p=>p.name).join("\n")}</textarea>
      <button class="btn primary block" type="submit" style="margin-top:8px">저장</button>
    </form>`)}
function saveSchema(){const l=L();const tn=document.querySelector("#schemaForm [name=tenses]").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const pn=document.querySelector("#schemaForm [name=persons]").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(!tn.length||!pn.length){toast("시제랑 인칭을 각각 하나 이상 적어 줘");return}
  l.tenses=tn.map((name,i)=>({id:l.tenses[i]?.id||("t"+uid()),name}));
  l.persons=pn.map((name,i)=>({id:l.persons[i]?.id||("p"+uid()),name}));
  save();closeSheet();render();toast("칸 이름을 바꿔 뒀어")}

function openBackup(){openSheet(`<div class="grab"></div><h3>백업 · 가져오기 <button class="x" data-close aria-label="닫기">✕</button></h3>
  <p class="hint">단어를 JSON 파일로 저장하거나, 예전에 저장한 파일을 가져올 수 있어. 가져오기는 기존 단어에 합쳐져.</p>
  <button class="btn primary block" id="exportBtn" type="button">내보내기</button>
  <button class="btn block" id="importBtn" type="button" style="margin-top:8px">가져오기</button>
  <input id="importFile" type="file" accept="application/json,.json" hidden>`)}
function doExport(){const blob=new Blob([JSON.stringify({v:2,exported:new Date().toISOString(),cur:S.cur,langs:S.langs,words:S.words,customSub:S.customSub},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="단어구름-백업-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("파일을 저장했어")}
function doImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{
    const o=JSON.parse(r.result);if(!o||typeof o!=="object"||!o.words)throw new Error("형식");
    const langs=Array.isArray(o.langs)?o.langs:[];langs.forEach(l=>{if(l&&l.id&&l.name&&!S.langs.some(x=>x.id===l.id))S.langs.push({id:l.id,name:l.name,flag:l.flag||"🌍",tts:l.tts||"",persons:l.persons,tenses:l.tenses})});
    if(o.customSub)Object.keys(o.customSub).forEach(k=>{S.customSub[k]=S.customSub[k]||[];(o.customSub[k]||[]).forEach(s=>{if(!S.customSub[k].includes(s))S.customSub[k].push(s)})});
    let add=0;const src=o.words||{};Object.keys(src).forEach(k=>{S.words[k]=S.words[k]||[];const ids=new Set(S.words[k].map(w=>w.id));
      (src[k]||[]).forEach(w=>{if(!w||!w.word||!w.meaning)return;if(w.id&&ids.has(w.id))return;if(!w.id)w.id=uid();
        if(w.pos==null)w.pos="";if(w.sub==null)w.sub="";w.conj=w.conj||{};w.conjAuto=w.conjAuto||{};
        S.words[k].push(w);ids.add(w.id);add++})});
    migrate(S);save();closeSheet();render();toast(add?add+"개 가져왔어":"새 단어가 없었어");
  }catch(err){toast("파일을 읽지 못했어")}};r.readAsText(file)}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;window._canInstall=true;if((S.view||"home")==="home")render()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;window._canInstall=false;toast("홈 화면에 추가됐어")});
function handleInstall(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null});return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  openSheet(`<div class="grab"></div><h3>홈 화면에 두기 <button class="x" data-close aria-label="닫기">✕</button></h3>
    <p>${ios?"Safari에서 아래처럼 하면 앱처럼 열려요.":"브라우저 메뉴에서 ‘홈 화면에 추가’ 또는 ‘앱 설치’를 눌러 줘."}</p>
    ${ios?"<ol style='padding-left:1.2em;line-height:1.7'><li>아래의 <b>공유</b> 버튼을 누르고</li><li><b>홈 화면에 추가</b>를 선택하면 돼.</li></ol>":""}
    <p class="hint">한 번 설치하면 오프라인에서도 쓸 수 있어. (이 주소의 임시 링크는 나중에 바뀔 수 있어.)</p>`)}

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
S.view="home";
render();
</script>
</body>
</html>
